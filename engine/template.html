<!doctype html>
<html><head><meta charset="utf-8"><title>Carrossel engine</title>
<style id="base">
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#333}
#stage{width:1080px;height:1350px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--text);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
.dark{background:var(--dark);color:var(--inkD)}
.light{background:var(--light);color:var(--inkL)}
.dark .mut{color:var(--mutD)} .light .mut{color:var(--mutL)}
.dark .acc{color:var(--accent)}
.light .acc{color:var(--accent)}
/* grid aparente */
.gl{position:absolute;inset:0;pointer-events:none}
.gl i{position:absolute;top:0;bottom:0;width:1px}
.gl b{position:absolute;left:0;right:0;height:1px}
.dark .gl i,.dark .gl b{background:var(--line)} .light .gl i,.light .gl b{background:var(--lineL)}
/* header / footer */
.hdr{position:absolute;left:80px;right:80px;top:54px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mark{display:flex;align-items:center;gap:14px}
.mark .nm{display:flex;flex-direction:column;gap:5px}
.mark .nm b{display:flex;align-items:center;gap:7px;font:600 24px/1 var(--text);letter-spacing:-.01em}
.mark .nm i{font:400 19px/1 var(--text);font-style:normal}
.dark .mark .nm i{color:var(--mutD)} .light .mark .nm i{color:var(--mutL)}
.mark .ph{width:54px;height:54px;border-radius:50%;background:var(--accent) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:700 19px/1 var(--text);color:#0B0B0C;letter-spacing:-.02em}
.mark .vf{width:22px;height:22px}
.light .mark .ph{box-shadow:0 0 0 3px #FFFFFF,0 0 0 4px rgba(17,18,20,.10)}
.dark .mark .ph{box-shadow:0 0 0 3px #F4F4F1}
.ctr{font:400 18px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.dark .ctr{color:var(--mutD)} .light .ctr{color:var(--mutL)}
.ftr{position:absolute;left:80px;right:80px;bottom:60px;display:flex;justify-content:space-between;align-items:center;font:400 20px/1 var(--text);z-index:5}
.dark .ftr{color:var(--mutD)} .light .ftr{color:var(--mutL)}
.ftr .h{display:flex;align-items:center;gap:10px}
.ftr .av{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),var(--accentDeep))}
.label{font:400 19px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.dark .label{color:var(--mutD)} .light .label{color:var(--mutL)}
/* tipografia */
.hc{font:400 112px/1.0 var(--display);letter-spacing:-.04em}
.hp{font:400 200px/.92 var(--display);letter-spacing:-.05em}
.h1{font:400 88px/1.03 var(--display);letter-spacing:-.035em}
.h2{font:400 72px/1.05 var(--display);letter-spacing:-.03em}
.h3{font:400 56px/1.1 var(--display);letter-spacing:-.025em}
.eb{font:400 30px/1.38 var(--text)}
.dark .eb{color:var(--mutD)} .light .eb{color:var(--mutL)}
.eb b{font-weight:600} .dark .eb b{color:var(--inkD)} .light .eb b{color:var(--inkL)}
.bd{font:400 30px/1.42 var(--text);max-width:780px}
.dark .bd{color:var(--mutD)} .light .bd{color:var(--mutL)}
.bd b{font-weight:600} .dark .bd b{color:var(--inkD)} .light .bd b{color:var(--inkL)}
.blk{position:absolute;left:80px;right:80px}
.hc,.hp,.h1,.h2,.h3{text-wrap:balance}.bd,.eb{text-wrap:pretty}
/* pílulas */
.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border-radius:999px;font:500 28px/1 var(--text);white-space:nowrap}
.dark .pill{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);color:var(--inkD)}
.light .pill{background:#fff;border:1.5px solid rgba(17,18,20,.12);color:var(--inkL)}
.pill .d{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pill.lime{background:var(--lime)!important;color:#0B0B0C!important;border-color:var(--lime)!important}
.cta{display:inline-flex;align-items:center;gap:14px;padding:24px 40px;border-radius:999px;background:var(--lime);color:#0B0B0C;font:600 32px/1 var(--text)}
/* cards */
.card{position:absolute;border-radius:32px;overflow:hidden}
.dark .card.glass{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.10)}
.light .card.glass{background:#fff;border:1.5px solid rgba(17,18,20,.08);box-shadow:0 30px 60px -30px rgba(0,0,0,.18)}
.card.white{background:#FAFAF7;color:var(--inkL);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.card.white .mut{color:var(--mutL)}
.card.white .acc{color:var(--blue)}
.card.white .bd{color:var(--mutL)} .card.white .bd b{color:var(--inkL)}
/* linhas de lista */
.row{display:grid;grid-template-columns:200px 1fr;align-items:baseline;padding:34px 0;border-top:1.5px solid}
.dark .row{border-color:rgba(255,255,255,.12)} .light .row{border-color:rgba(17,18,20,.12)}
.row:last-child{border-bottom:1.5px solid}
.dark .row:last-child{border-bottom-color:rgba(255,255,255,.12)} .light .row:last-child{border-bottom-color:rgba(17,18,20,.12)}
.row .ix{font:400 20px/1 var(--mono);letter-spacing:.08em}
.dark .row .ix{color:var(--mutD)} .light .row .ix{color:var(--mutL)}
.row .tx{font:400 46px/1.12 var(--display);letter-spacing:-.025em}
.row .tx small{display:block;font:400 26px/1.4 var(--text);letter-spacing:0;margin-top:10px}
.dark .row .tx small{color:var(--mutD)} .light .row .tx small{color:var(--mutL)}
/* grão */
.grain{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:.09;mix-blend-mode:overlay}
.swipe{position:absolute;right:80px;bottom:128px;font:300 54px/1 var(--text);z-index:6}
.phb{position:absolute;background:#141416 center/cover no-repeat;overflow:hidden}
.phb.empty{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px),#161618;outline:2px dashed rgba(255,255,255,.16);outline-offset:-14px}
.light .phb.empty{background:repeating-linear-gradient(135deg,rgba(17,18,20,.04) 0 2px,transparent 2px 16px),#E4E4DE;outline-color:rgba(17,18,20,.2)}
.phb .pl{position:absolute;left:0;right:0;transform:translateY(-50%);text-align:center;font:400 18px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);display:flex;gap:12px;justify-content:center;align-items:center}
.light .phb .pl{color:rgba(17,18,20,.45)}
.phb .cam{width:22px;height:16px;border:2px solid currentColor;border-radius:4px;display:inline-block}
</style></head>
<body><div id="stage"></div>
<script>
let B=null,SPEC=null,THEME='dark';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// rich: "A || B" troca para tom suave; *x* = destaque; \n = quebra
function nbw(s){return String(s).replace(/(?<=^|[ \u00A0|*])([aàeéoAÀEÉO]) /g,'$1\u00A0').split('\n').map(seg=>{const i=seg.lastIndexOf(' ');return (seg.trim().split(/ +/).length>=3&&i>0)?seg.slice(0,i)+'\u00A0'+seg.slice(i+1):seg;}).join('\n');}
function rich(s,soft='mut'){const parts=nbw(s).split('||');return parts.map((p,i)=>{let h=esc(p).replace(/\*([^*]+)\*/g,'<span class="acc">$1</span>').replace(/\n/g,'<br>');return i?`<span class="${soft}">${h}</span>`:h;}).join('');}
function richB(s){return esc(nbw(s)).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<span class="acc">$1</span>').replace(/\n/g,'<br>');}
function vars(){const c=B.colors,f={};for(const k in B.fonts)f[k]=B.fonts[k].replace(/"/g,"'");return `--dark:${c.dark};--dark2:${c.dark2};--light:${c.light};--light2:${c.light2};--inkD:${c.inkOnDark};--inkL:${c.inkOnLight};--mutD:${c.mutedOnDark};--mutL:${c.mutedOnLight};--accent:${THEME==='light'?(c.blue||c.accent):c.accent};--lime:${c.accent};--seal:${c.seal||c.accent};--sealCk:${c.sealCheck||'#0B0B0C'};--blue:${c.blue||'#1F4FFF'};--onacc:${THEME==='light'?'#FFFFFF':'#0B0B0C'};--neg:${c.neg||'#E5484D'};--accentDeep:${c.accentDeep};--line:${c.line};--lineL:${c.lineLight};--display:${f.display};--text:${f.text};--mono:${f.mono}`;}
const GRAIN=`<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>`;
function gridlines(){return `<div class="gl"><i style="left:80px"></i><i style="left:390px"></i><i style="left:690px"></i><i style="left:1000px"></i><b style="top:200px"></b><b style="top:1190px"></b></div>`;}
const VF=`<svg class="vf" viewBox="0 0 24 24"><path fill="var(--seal)" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M7.6 12.2l3 3 5.8-6" fill="none" stroke="var(--sealCk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function header(i,n,s){const ctr=s.counter===false?'':`${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;const ph=B.avatar?`<span class="ph" style="background-image:url('${B.avatar}')"></span>`:`<span class="ph">OH</span>`;return `<div class="hdr"><div class="mark">${ph}<div class="nm"><b>${esc(B.name)}${B.verified===false?'':VF}</b><i>${esc(B.handle)}</i></div></div><div class="ctr">${ctr}</div></div>`;}
function footer(){return `<div class="ftr"><div class="h">${esc(B.footer||B.handle)}</div><div>${esc(SPEC.series||B.year)}</div></div>`;}

// ---------- visuais ----------
const V={
 glow:(o={})=>{return '';const x=o.x??85,y=o.y??90,a=o.a??0.22;return `<div style="position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at ${x}% ${y}%, rgba(212,255,58,${a}), rgba(212,255,58,0) 70%)"></div>`;},
 feed:(o={})=>{ // grade de posts em perspectiva, um aceso
  const cols=9,rows=9,hot=o.hot??[4,4];let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const on=r===hot[0]&&c===hot[1];cells+=`<div style="border-radius:14px;${on?'background:var(--accent);box-shadow:none':'background:#1A1A1D;border:1.5px solid rgba(255,255,255,.07)'}"></div>`;}
  return `<div style="position:absolute;left:-160px;right:-160px;top:${o.top??640}px;height:1100px;perspective:1100px;perspective-origin:50% 0%"><div style="position:absolute;inset:0;transform:rotateX(58deg);transform-origin:50% 0%;display:grid;grid-template-columns:repeat(${cols},1fr);gap:26px;padding:0 40px">${cells}</div></div><div style="position:absolute;left:0;right:0;top:${(o.top??640)-40}px;height:260px;background:linear-gradient(var(--dark),rgba(11,11,12,0))"></div><div style="position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(rgba(11,11,12,0),var(--dark))"></div>`;},
 dots:(o)=>{ // comparação com grade de pontos
  SEED=7;const card=(x,title,sub,mode)=>{let d='';for(let r=0;r<5;r++)for(let c=0;c<5;c++){let st='';if(mode==='chaos'){const g=['#3A3A3F','#5B5D63','#8C8F94','#26262A'];const s=28+Math.floor(rnd()*30);const col=g[Math.floor(rnd()*4)];const dx=(rnd()-.5)*22,dy=(rnd()-.5)*22;st=`width:${s}px;height:${s}px;background:${col};transform:translate(${dx}px,${dy}px)`;}else{st=`width:44px;height:44px;background:var(--accent);box-shadow:none`;}d+=`<div style="display:flex;align-items:center;justify-content:center"><div style="border-radius:50%;${st}"></div></div>`;}
   return `<div class="card glass" style="left:${x}px;top:${o.top??600}px;width:444px;height:444px;display:grid;grid-template-columns:repeat(5,1fr);padding:40px">${d}</div><div class="label" style="position:absolute;left:${x}px;top:${(o.top??600)+470}px;width:444px">${esc(title)}</div><div class="bd" style="position:absolute;left:${x}px;top:${(o.top??600)+506}px;width:444px;font-size:26px">${richB(sub)}</div>`;};
  return card(80,o.a.label,o.a.sub,'chaos')+card(556,o.b.label,o.b.sub,'code');},
 grid16:(o={})=>{const cols=o.cols??16,cell=1080/cols,c=THEME==='light'?`rgba(17,18,20,${o.a??.07})`:`rgba(255,255,255,${o.a??.06})`;return `<div style="position:absolute;inset:0;background-image:linear-gradient(${c} 1px,transparent 1px),linear-gradient(90deg,${c} 1px,transparent 1px);background-size:${cell}px ${cell}px;background-position:0 ${o.y??0}px;-webkit-mask-image:radial-gradient(ellipse ${o.mw??75}% ${o.mh??60}% at 50% ${o.my??50}%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse ${o.mw??75}% ${o.mh??60}% at 50% ${o.my??50}%,#000 35%,transparent 100%)"></div>`;},
 keys:(o)=>{ // teclas 3D empilhadas
  const cols={white:['#FFFFFF','#E4E4DF','#C9C9C3','#111214'],lime:['#E6FF8A','#D4FF3A','#9CC400','#0B0B0C'],dark:['#3A3A3F','#232326','#111113','#F4F4F1']};
  return `<div style="position:absolute;left:50%;top:${o.top??300}px;transform:translateX(-50%);display:flex;flex-direction:column;gap:22px;align-items:center">${o.items.map(([w,c])=>{const k=cols[c];return `<div style="width:300px;height:190px;border-radius:44px;background:linear-gradient(160deg,${k[0]},${k[1]} 55%,${k[2]});box-shadow:inset 0 -18px 0 rgba(0,0,0,.18),inset 0 6px 10px rgba(255,255,255,.6),0 30px 50px -20px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font:500 46px var(--display);letter-spacing:-.02em;color:${k[3]}">${esc(w)}</div>`;}).join('')}</div>`;},
};
let SEED=1;function rnd(){SEED=(SEED*16807)%2147483647;return (SEED-1)/2147483646;}

// ---------- módulos ----------
const M={
 // A · capa: label + título grande + visual + seta
 A:(s)=>`${s.visual?V[s.visual](s.vopt||{}):''}${s.grid!==false?gridlines():''}
  <div class="blk" style="top:${s.top??228}px"><div class="label" style="margin-bottom:36px">${esc(s.label||'')}</div><div class="hc" style="max-width:${s.maxw??900}px">${rich(s.title)}</div>${s.body?`<div class="bd" style="margin-top:36px">${richB(s.body)}</div>`:''}</div>
  ${s.swipe!==false?'<div class="swipe">→</div>':''}`,
 // B · texto: olho + título + apoio
 B:(s)=>`${s.visual?V[s.visual](s.vopt||{}):''}${s.grid?gridlines():''}
  <div class="blk" style="top:${s.top??250}px">${s.eyebrow?`<div class="eb" style="max-width:760px">${richB(s.eyebrow)}</div>`:''}</div>
  <div class="blk" style="top:${s.titleTop??560}px"><div class="h1" style="max-width:${s.maxw??900}px">${rich(s.title)}</div>${s.body?`<div class="bd" style="margin-top:40px">${richB(s.body)}</div>`:''}</div>`,
 // C · card flutuante
 C:(s)=>`${V.glow({x:20,y:15,a:.18})}${V.glow({x:90,y:95,a:.14})}${gridlines()}
  <div class="card white" style="left:80px;right:80px;top:${s.top??230}px;bottom:${s.bottom??230}px;padding:72px">
   <div class="h2">${rich(s.title)}</div>${s.photo!==undefined?PH(s.photo,s.phLabel,`left:72px;right:72px;top:${s.phTop??330}px;height:${s.phH??300}px;border-radius:20px`):''}
   <div style="position:absolute;left:72px;right:72px;bottom:72px"><div style="width:44px;height:6px;border-radius:3px;background:var(--blue);margin-bottom:28px"></div><div class="h3" style="font-size:44px">${rich(s.sub||'')}</div>${s.body?`<div class="bd" style="margin-top:20px;font-size:28px">${richB(s.body)}</div>`:''}</div></div>`,
 // E · pílulas soltas num card + título
 E:(s)=>`${s.grid?gridlines():''}
  <div class="blk" style="top:230px">${s.eyebrow?`<div class="eb" style="max-width:800px">${richB(s.eyebrow)}</div>`:''}</div>
  <div class="card glass" style="left:80px;right:80px;top:${s.cardTop??470}px;height:${s.cardH??400}px">${V.glow({x:70,y:40,a:.16})}${(s.pills||[]).map(p=>`<div class="pill ${p.lime?'lime':''}" style="position:absolute;left:${p.x}px;top:${p.y}px">${p.lime?'':'<span class="d"></span>'}${esc(p.t)}</div>`).join('')}</div>
  <div class="blk" style="top:${(s.cardTop??470)+(s.cardH??400)+70}px"><div class="h2">${rich(s.title)}</div></div>`,
 // F · em vez de / tente
 F:(s)=>`${s.grid!==false?gridlines():''}
  <div class="blk" style="top:240px"><div class="h2" style="max-width:860px">${rich(s.title)}</div></div>
  ${s.compact?`<div class="blk" style="top:${s.pairsTop??520}px">${(s.pairs||[]).map(p=>`<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:40px;padding:34px 0;border-top:1.5px solid ${LN()}"><div><div class="label" style="margin-bottom:14px;color:var(--neg)">✕ &nbsp;Em vez de</div><div class="h3 mut" style="font-size:42px">${rich(p.from)}</div></div><div><div class="label" style="margin-bottom:14px;color:var(--accent)">✓ &nbsp;Tente</div><div class="h3" style="font-size:46px">${rich(p.to)}</div></div></div>`).join('')}</div>`:''}
  ${(s.compact?[]:(s.pairs||[])).map((p,k)=>{const y=(s.pairsTop??620)+k*300;return `<div class="blk" style="top:${y}px">
   <div class="label" style="margin-bottom:16px;color:var(--neg)">✕ &nbsp;Em vez de</div><div class="h3 mut" style="font-size:54px">“${esc(p.from)}”</div>
   <div class="label" style="margin:56px 0 16px">✓ &nbsp;Tente</div><div class="h3" style="font-size:68px;line-height:1.08">“${rich(p.to)}”</div></div>`;}).join('')}`,
 // G · lista numerada com linhas
 G:(s)=>`${s.grid?gridlines():''}
  <div class="blk" style="top:240px">${s.eyebrow?`<div class="eb" style="max-width:820px;margin-bottom:24px">${richB(s.eyebrow)}</div>`:''}<div class="h2" style="max-width:880px">${rich(s.title)}</div></div>
  <div class="blk" style="top:${s.listTop??620}px">${(s.items||[]).map((it,k)=>`<div class="row"><div class="ix">${String(k+1).padStart(2,'0')}</div><div class="tx">${rich(it.t)}${it.s?`<small>${richB(it.s)}</small>`:''}</div></div>`).join('')}</div>`,
 // K · infográfico de pontos
 K:(s)=>`${gridlines()}<div class="blk" style="top:240px"><div class="h1" style="max-width:900px">${rich(s.title)}</div></div>${V.dots(s)}
  ${s.foot?`<div class="blk" style="top:${(s.top??600)+640}px"><div class="h3" style="font-size:44px">${rich(s.foot)}</div></div>`:''}`,
 // L · palavra gigante
 L:(s)=>`${V.glow({x:100,y:60,a:.25})}${gridlines()}
  <div class="blk" style="top:250px"><div class="h2" style="max-width:820px">${rich(s.title)}</div></div>
  <div style="position:absolute;left:66px;top:${s.bigTop??560}px;font:500 ${s.bigSize??330}px/.86 var(--display);letter-spacing:-.06em;white-space:nowrap;color:var(--accent)">${esc(s.big)}</div>
  ${s.body?`<div class="blk" style="top:${s.bodyTop??1000}px"><div class="bd">${richB(s.body)}</div></div>`:''}`,
 // M · fechamento + CTA
 M:(s)=>`${s.visual?V[s.visual](s.vopt||{}):''}${V.glow({x:50,y:55,a:.2})}
  <div class="blk" style="top:${s.top??330}px;text-align:center"><div class="h1" style="margin:0 auto;max-width:880px">${rich(s.title)}</div>${s.body?`<div class="bd" style="margin:40px auto 0;max-width:760px">${richB(s.body)}</div>`:''}
  <div style="margin-top:64px"><span class="cta">${esc(s.cta)}</span></div>${s.note?`<div class="bd" style="margin:28px auto 0;font-size:28px">${esc(nbw(s.note))}</div>`:''}</div>`,
 // P · pôster de teclas (estático)
 P:(s)=>`${V.glow({x:50,y:50,a:.12})}${V.keys(s)}${s.title?`<div class="blk" style="bottom:150px;text-align:center"><div class="label">${esc(s.title)}</div></div>`:''}`,
};

// ===================== MÓDULOS v3 (templates T02–T10) =====================
const isImg=s=>typeof s==='string'&&/^data:image/.test(s);
function PH(src,label,st,o={}){ // foto ou espaço reservado
 if(isImg(src))return `<div class="phb" style="${st};background-image:url('${src}')"></div>`;

function shade(dir='top',a=.92){return `<div style="position:absolute;inset:0;background:linear-gradient(to ${dir},rgba(11,11,12,${a}) 0%,rgba(11,11,12,${a*.6}) 42%,rgba(11,11,12,0) 78%)"></div>`;}
const TREE=(c,w=60)=>`<svg width="${w}" height="${w*1.35}" viewBox="0 0 40 54"><path d="M20 2 L34 22 H27 L37 38 H24 V52 H16 V38 H3 L13 22 H6 Z" fill="${c}"/></svg>`;

   h+=`<div style="position:absolute;left:${x}px;top:${y}px;">${TREE(on?'var(--accent)':dim,w)}</div>`;}}return h;},
 same:(o={})=>{const cols=o.cols??4,rows=o.rows??3,top=o.top??560,cw=(920-(cols-1)*22)/cols,ch=o.ch??cw;let h='';const bg=THEME==='light'?'#FFFFFF':'#18181B',bd=THEME==='light'?'rgba(17,18,20,.08)':'rgba(255,255,255,.07)',ink=THEME==='light'?'#D9D9D3':'#2E2E33';

 echo:(o={})=>{const n=o.n??6,top=o.top??560,sz=o.size??118;let h='';for(let k=0;k<n;k++){const last=k===n-1;h+=`<div style="position:absolute;left:80px;top:${top+k*sz*.92}px;font:400 ${sz}px/1 var(--display);letter-spacing:-.04em;white-space:nowrap;${last?'color:var(--accent)':`opacity:${(.08+k*.1).toFixed(2)}`}">${esc(o.word)}</div>`;}return h;},
 spot:(o={})=>{const x=o.x??540,y=o.y??1060;return `<div style="position:absolute;left:${x-260}px;top:0;width:520px;height:${y+40}px;background:radial-gradient(ellipse 50% 100% at 50% 0%,rgba(212,255,58,0) 0%,rgba(212,255,58,0) 30%,transparent 31%),linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.05));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)"></div><div style="position:absolute;left:${x-150}px;top:${y+10}px;width:300px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)"></div><div style="position:absolute;left:${x-12}px;top:${y-22}px">${PERSON('var(--accent)',24)}</div>`;},
 check:(o={})=>`<div style="position:absolute;left:${o.x??80}px;top:${o.top??700}px;width:${o.s??300}px;height:${o.s??300}px;border-radius:${(o.s??300)*.22}px;border:6px solid rgba(255,255,255,.18)"><svg viewBox="0 0 100 100" style="position:absolute;inset:-12%;width:124%;height:124%"><path d="M22 52 L42 72 L82 28" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style=""/></svg></div>`,
});

});

// ---------- revisão automática (viúva, margem, header/footer) ----------
window.qa=()=>{const out=[];const root=document.getElementById('slide');
 root.querySelectorAll('.hc,.hp,.h1,.h2,.h3,.bd,.eb,.row .tx,.pill,.cta,.chk').forEach(el=>{if(el.closest('.hdr,.ftr'))return;
  const words=[];const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
  while(n=tw.nextNode()){const re=/[^ \t\n]+/g;let m;while(m=re.exec(n.nodeValue)){const r=document.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);const rc=r.getClientRects()[0];if(rc&&rc.width&&/[\p{L}\p{N}]/u.test(m[0]))words.push({w:m[0],top:rc.top,left:rc.left,right:rc.right,bottom:rc.bottom});}}
  if(!words.length)return;const lines=[];words.forEach(w=>{const L=lines.find(l=>Math.abs(l.top-w.top)<w.bottom-w.top-4);L?L.n.push(w):lines.push({top:w.top,n:[w]});});
  lines.slice(0,-1).forEach(l=>{const lw=l.n[l.n.length-1].w.split('\u00A0').pop();if(/^[\p{L}]$/u.test(lw))out.push(`letra solta no fim da linha: "${lw}" em "${el.textContent.replace(/\s+/g,' ').trim().slice(0,40)}"`);});
  const txt=el.textContent.replace(/\s+/g,' ').trim().slice(0,48);
  const lastN=lines.length?lines[lines.length-1].n.reduce((k,w)=>k+w.w.split('\u00A0').length,0):0;
  const segs=el.innerText.split('\n').map(x=>x.trim()).filter(Boolean);const brLast=segs.length>1&&segs[segs.length-1].split(/[ \u00A0]+/).length===1;
  if(lines.length>1&&lastN===1&&!brLast&&!el.matches('.pill,.cta'))out.push(`viúva: "${lines[lines.length-1].n[0].w}" sozinha na última linha de "${txt}"`);
  const R=Math.max(...words.map(w=>w.right)),Lf=Math.min(...words.map(w=>w.left)),B=Math.max(...words.map(w=>w.bottom)),T=Math.min(...words.map(w=>w.top));
  if(!el.closest('[data-bleed]')){if(R>1001)out.push(`fora da margem direita (${Math.round(R)}px): "${txt}"`);if(Lf<79)out.push(`fora da margem esquerda (${Math.round(Lf)}px): "${txt}"`);}
  if(B>1250)out.push(`encosta no rodapé (${Math.round(B)}px): "${txt}"`);if(T<108)out.push(`encosta no topo (${Math.round(T)}px): "${txt}"`);});
 return out;};

function renderSlide(i){const s=SPEC.slides[i],n=SPEC.slides.length;const theme=s.theme||'dark';THEME=theme;
 document.getElementById('stage').innerHTML=`<div class="slide ${theme}" id="slide" style="${vars()}">${M[s.m](s)}${s.imgSrc?`<div class="phb" style="left:${s.imgX??80}px;top:${s.imgY??600}px;width:${s.imgW??920}px;height:${s.imgH??300}px;border-radius:${s.imgR??0}px;background-color:transparent;background-image:url('${s.imgSrc}')"></div>`:''}${s.chrome===false?'':header(i,n,s)+footer()}${GRAIN}</div>`;
